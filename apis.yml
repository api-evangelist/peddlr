name: Peddlr
description: Peddlr is a Philippine fintech startup offering free mobile point-of-sale
  (POS) and bookkeeping software for Filipino micro, small, and medium businesses (MSMEs).
  Its app spans sales recording, offline inventory management, expense tracking, cash
  and credit ledgers, bills payment, QRPH, e-loading and gaming pins, a payment ledger,
  and accounting reports, with over two million downloads across 1,400+ cities and
  municipalities. Peddlr is registered with the Bangko Sentral ng Pilipinas as an
  Operator of Payment Systems. The company publishes no public developer program or
  API at this time; this profile captures its identity, published web properties, and
  domain-security posture for the API Evangelist network.
